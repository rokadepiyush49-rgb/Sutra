# Trivy secret-scan exceptions for CI's image scan (TRIVY_SECRET_CONFIG in ci.yml).
allow-rules:
  # The gcp-service-account rule matches only the marker `"type": "service_account"`. Anthropic SDK 1.15+
  # docstrings contain that marker as an example value, which failed the API image scan. A real service
  # account key always carries a private key too, and the private-key rule still catches it.
  - id: gcp-service-account-marker
    description: 'Bare "type": "service_account" marker, e.g. in Anthropic SDK docstrings'
    regex: '"type": "service_account"'
