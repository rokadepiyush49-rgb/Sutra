version: 2
updates:
  - { package-ecosystem: uv, directory: "/", schedule: { interval: weekly }, groups: { python: { patterns: ["*"] } } }
  - package-ecosystem: npm
    directory: "/frontend"
    schedule: { interval: weekly }
    groups: { npm: { patterns: ["*"], update-types: [minor, patch] } }
    ignore:
      # typescript-eslint (used by eslint-config-next) supports TypeScript < 6.1 only; TS 7 breaks `npm run lint`.
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
  - { package-ecosystem: github-actions, directory: "/", schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: "/docker", schedule: { interval: weekly } }
  - package-ecosystem: terraform
    directory: "/infra/terraform/modules/sutra"
    schedule: { interval: weekly }
    ignore:
      # These majors rename inputs and need AWS provider v6: upgrade them by hand, with a plan. Named versions,
      # because Dependabot does not apply update-types to Terraform requirement ranges like "~> 6.10".
      - { dependency-name: "terraform-aws-modules/eks/aws", versions: [">= 21.0.0"] }
      - { dependency-name: "terraform-aws-modules/vpc/aws", versions: [">= 6.0.0"] }
      - { dependency-name: "terraform-aws-modules/rds/aws", versions: [">= 7.0.0"] }
      - { dependency-name: "terraform-aws-modules/eks-pod-identity/aws", versions: [">= 2.0.0"] }
